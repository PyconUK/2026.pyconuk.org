# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

plugins:
  - jekyll-redirect-from

title: "PyCon UK 2026"

# Flags for when things™ happen
cfp_open: false
cfp_closed: false
fin_aid_open: false
fin_aid_closed: false
spons_prosp_avail: false
tickets_open: false
tickets_sold_out: false
schedule_ready: false
schedule_final: false
show_sponsors: false
show_django_girls: false
django_girls_applications_open: false

# When changing the year, please change it in the title, above. We can't use vars in vars.
con_year: 2026
con_startDate: "1971-01-01"
con_start: Noday 0th Nomonther
con_endDate: "1971-01-01"
con_finish: Noday 0th Nomonther
con_financial_assistance_deadline: "17:00 (Europe/London) on Noday, 0th Nomonther"
cfp_end: Noday 0th Nomonther 2026
django_girls_date: Noday 0th Nomonther
young_coders_date: Noday 0th Nomonther

con_location: Nowhere
con_director: Nobody - please get in touch if you want to help in 2027

con_vat_number: GB431251341
# Don't forget to update the invoicing page if the con_company changes
con_company: UKPA Trading Ltd. (a company registered in England and Wales <a href="https://beta.companieshouse.gov.uk/company/12254310">no.&nbsp;12254310</a>)
ukpa: The UK&nbsp;Python Association (a charity registered in England and Wales <a href="https://register-of-charities.charitycommission.gov.uk/en/charity-search/-/charity-details/5101629?_uk_gov_ccew_onereg_charitydetails_web_portlet_CharityDetailsPortlet_organisationNumber=5101629">no.&nbsp;1173471</a>)

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://2026.pyconuk.org" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
source: src
destination: _site
markdown: kramdown

sass:
  style: "compact"

permalink: "/:year/:month/:title/"
